<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Todolist</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
       <div class="header">
        <p>My Todolist📒</p>
       </div>
        

       <div class="container">
    <form class="form">
            <input type="text" placeholder="Add A Task...">
            <button type="submit" class="add-task">Add Task</button>
        </form>

    
            <ul>
                <li>
                    <input type="checkbox" id="task1">
                    <label for="task1">Pick Fruits</label>
                </li>
                <li>
                    <input type="checkbox" id="task2">
                    <label for="task2">Clean the House</label>
                </li>
                <li>
                    <input type="checkbox" id="task3">
                    <label for="task3">Watch Anime</label>
                </li>
                <li>
                    <input type="checkbox" id="task4">
                    <label for="task4">Play Games</label>
                    </li>
                <li>
                    <input type="checkbox" id="task5">
                    <label for="task5">Read a Book</label>
                </li>
       
        </div>
    </body>
</html>
